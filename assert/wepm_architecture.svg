<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750" role="img" aria-labelledby="title desc">
  <title id="title">WePM inference and training architecture</title>
  <desc id="desc">A shared vision encoder and multimodal backbone serve three task paths. Embedding uses an E slot, Decision uses a J slot and a direct candidate head, and Generation decodes without a soft slot. MGVB budgets visual tokens. ULKD distills generation and embedding knowledge, and SEMO accumulates task gradients before a joint update.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#47806a"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #18372c; }
      .section { font-size: 29px; font-weight: 700; fill: #0e5038; }
      .heading { font-size: 20px; font-weight: 700; fill: #0e5038; }
      .label { font-size: 16px; font-weight: 700; }
      .body { font-size: 15px; }
      .detail { font-size: 14px; fill: #365e4d; }
      .muted { fill: #365e4d; }
      .center { text-anchor: middle; }
      .panel { fill: #f2f8f4; stroke: #a7c9b7; stroke-width: 1.5; }
      .card { fill: #fff; stroke: #b5d3c3; stroke-width: 1.5; }
      .shared { fill: #e2f0e8; stroke: #8dbba4; stroke-width: 1.5; }
      .chip { fill: #e4f1ea; }
      .route { fill: none; stroke: #47806a; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
      .arrow { marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1120" height="750" fill="#fff"/>

  <g id="inference">
    <rect class="panel" x="12" y="12" width="1096" height="404" rx="24"/>
    <text class="section" x="38" y="54">Shared inference architecture</text>
    <text class="body muted" x="39" y="80">One vision encoder and one multimodal backbone serve three task paths.</text>

    <rect class="card" x="38" y="144" width="104" height="76" rx="13"/>
    <text class="label center" x="90" y="188">Images</text>
    <path class="route arrow" d="M142 182H169"/>

    <rect class="card" x="175" y="144" width="130" height="76" rx="13"/>
    <text class="label center" x="240" y="177">Vision</text>
    <text class="label center" x="240" y="198">encoder</text>
    <path class="route arrow" d="M305 182H330"/>

    <rect class="card" x="336" y="117" width="179" height="144" rx="13"/>
    <text class="heading" x="352" y="147">MGVB</text>
    <text class="detail" x="352" y="168">Visual token budget</text>
    <rect class="chip" x="352" y="178" width="147" height="70" rx="7"/>
    <text class="detail" x="363" y="197">Global bank</text>
    <text class="detail" x="363" y="217">Regional bank</text>
    <text class="detail" x="363" y="237">Fine-grained bank</text>
    <path class="route arrow" d="M515 182H550"/>

    <rect class="card" x="38" y="325" width="104" height="56" rx="13"/>
    <text class="label center" x="90" y="359">Prompt</text>
    <path class="route arrow" d="M90 325V282H424V265"/>
    <text class="detail" x="111" y="272">Prompt-conditioned visual selection</text>
    <path class="route arrow" d="M142 353H550"/>
    <text class="detail" x="163" y="342">Text tokens</text>

    <rect class="shared" x="556" y="117" width="176" height="264" rx="16"/>
    <text class="heading center" x="644" y="168">Multimodal</text>
    <text class="heading center" x="644" y="195">LLM backbone</text>
    <path d="M577 218H711" stroke="#9fc6b1" stroke-width="1.5"/>
    <text class="body center" x="644" y="250">Ordered text</text>
    <text class="body center" x="644" y="272">and visual tokens</text>
    <text class="detail center" x="644" y="318">Task-specific input</text>
    <text class="detail center" x="644" y="338">and readout</text>

    <path class="route arrow" d="M732 156H762"/>
    <path class="route arrow" d="M732 249H762"/>
    <path class="route arrow" d="M732 342H762"/>

    <rect class="card" x="768" y="117" width="314" height="78" rx="13"/>
    <text class="heading" x="784" y="146">Embedding</text>
    <rect class="chip" x="993" y="130" width="73" height="24" rx="12"/>
    <text class="detail center" x="1029.5" y="147">E slot</text>
    <text class="body" x="784" y="174">Linear projection → L2 normalization</text>

    <rect class="card" x="768" y="210" width="314" height="78" rx="13"/>
    <text class="heading" x="784" y="239">Decision (JEV)</text>
    <rect class="chip" x="993" y="223" width="73" height="24" rx="12"/>
    <text class="detail center" x="1029.5" y="240">J slot</text>
    <text class="body" x="784" y="267">Direct candidate head → softmax</text>

    <rect class="card" x="768" y="303" width="314" height="78" rx="13"/>
    <text class="heading" x="784" y="332">Generation</text>
    <rect class="chip" x="993" y="316" width="73" height="24" rx="12"/>
    <text class="detail center" x="1029.5" y="333">No slot</text>
    <text class="body" x="784" y="360">Autoregressive token decoding</text>
  </g>

  <path class="route arrow" d="M240 445V422" stroke-dasharray="4 5"/>
  <path class="route arrow" d="M788 445V422" stroke-dasharray="4 5"/>

  <g id="training">
    <rect class="panel" x="12" y="441" width="1096" height="297" rx="24"/>
    <text class="section" x="38" y="480">Training</text>

    <rect class="card" x="38" y="498" width="430" height="214" rx="15"/>
    <text class="heading" x="56" y="527">ULKD</text>
    <text class="detail" x="56" y="548">Unified Listwise Knowledge Distillation</text>
    <text class="label" x="56" y="575">Frozen multimodal teacher</text>
    <path class="route arrow" d="M65 583V605H80"/>
    <path class="route arrow" d="M65 605V656H80"/>

    <text class="label" x="89" y="611">Generation</text>
    <text class="detail" x="89" y="632">On-policy token KL on student rollout prefixes</text>
    <text class="label" x="89" y="662">Embedding</text>
    <text class="detail" x="89" y="683">Candidate-list KL and representation alignment</text>

    <rect class="card" x="488" y="498" width="594" height="214" rx="15"/>
    <text class="heading" x="506" y="527">SEMO</text>
    <text class="detail" x="506" y="548">Stable and Efficient Multitask Optimization</text>

    <rect class="chip" x="506" y="568" width="181" height="51" rx="9"/>
    <rect class="chip" x="695" y="568" width="181" height="51" rx="9"/>
    <rect class="chip" x="884" y="568" width="180" height="51" rx="9"/>
    <text class="label center" x="596.5" y="590">Embedding</text>
    <text class="label center" x="785.5" y="590">Generation</text>
    <text class="label center" x="974" y="590">Decision</text>
    <text class="detail center" x="596.5" y="609">λ<tspan baseline-shift="sub" font-size="10">rep</tspan> × L<tspan baseline-shift="sub" font-size="10">rep</tspan></text>
    <text class="detail center" x="785.5" y="609">λ<tspan baseline-shift="sub" font-size="10">gen</tspan> × L<tspan baseline-shift="sub" font-size="10">gen</tspan></text>
    <text class="detail center" x="974" y="609">λ<tspan baseline-shift="sub" font-size="10">dec</tspan> × L<tspan baseline-shift="sub" font-size="10">dec</tspan></text>

    <text class="detail center" x="785" y="643">Sequential backward passes at fixed parameters</text>
    <text class="detail center" x="785" y="662">Release each graph after backward</text>
    <rect class="shared" x="506" y="675" width="558" height="25" rx="8"/>
    <text class="label center" x="785" y="693">Accumulate weighted gradients → one optimizer step</text>
  </g>
</svg>
